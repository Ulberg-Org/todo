name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum --check
          tar -xzf "$tarball" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  prompt-log:
    name: prompt log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check .prompts/ format
        run: python3 .github/scripts/check_prompt_log.py
      - name: Test the prompt-log hook
        run: python3 .claude/hooks/test_prompt_log.py
      - name: Test the agent-identity hook (D41)
        run: python3 .claude/hooks/test_agent_identity.py

  fsharp-style:
    name: fsharp style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No mutation or null (docs/fsharp-style.md)
        run: .github/scripts/check_fsharp_style.sh

  backend:
    name: backend (format, build, test)
    # arm64 everywhere (D56): the same architecture as developer Macs and the cluster.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Format (Fantomas)
        run: dotnet fantomas --check backend/src backend/test
      - name: Build (warnings are errors)
        run: dotnet build backend/Todo.slnx -c Release
      - name: Test (real Postgres 18 via Testcontainers)
        run: dotnet run --project backend/test/TodoBackend.Test -c Release --no-build

  image:
    name: image (build, scan, SBOM)
    # arm64 everywhere (D56). On a PR: build, smoke-test, scan, SBOM. On main also push, lock, sign and attest
    # (D54, D55), with todo's own push identity: Repository Writer on todo/* only, trusted only from main.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # Azure sign-in (main) and Sigstore's keyless signing (main)
    env:
      IMAGE: todo/backend
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" \
            --build-arg BUILD_COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg IMAGE_TAG="$GITHUB_SHA" backend
      - name: Smoke test (read-only file system, no capabilities, as in the cluster)
        run: |
          # Health and version are on the management port (D73); the public port has nothing to answer yet.
          docker run -d --name smoke --read-only --cap-drop ALL --security-opt no-new-privileges -p 8081:8081 \
            -e "Database__ConnectionString=Host=127.0.0.1;Port=1;Database=todo;Username=todo_app;Password=x;Timeout=1" \
            "$IMAGE:$GITHUB_SHA"
          for _ in $(seq 1 30); do curl -sf http://localhost:8081/health/live && break; sleep 1; done
          curl -sf http://localhost:8081/version | jq -e --arg c "$GITHUB_SHA" '.commit == $c'
          docker rm -f smoke
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
      - name: Scan (fails on critical/high with a fix; exceptions in .trivyignore with an expiry, D55)
        run: >-
          trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1
          --ignorefile .trivyignore "$IMAGE:$GITHUB_SHA"
      - name: SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE:$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

      # main only: publish
      - name: Azure sign-in (todo's push identity)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ACR_PUSH_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push and lock the tag (a tag is never overwritten, D54)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        run: |
          registry="${{ vars.ACR_LOGIN_SERVER }}"
          az acr login --name "${registry%%.*}"
          docker tag "$IMAGE:$GITHUB_SHA" "$registry/$IMAGE:$GITHUB_SHA"
          docker push "$registry/$IMAGE:$GITHUB_SHA"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$registry/$IMAGE:$GITHUB_SHA")
          az acr repository update --name "${registry%%.*}" --image "$IMAGE:$GITHUB_SHA" \
            --write-enabled false --delete-enabled false -o none
          echo "ref=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Sign and attach the SBOM (keyless, bound to this workflow on main, D55)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes "${{ steps.push.outputs.ref }}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${{ steps.push.outputs.ref }}"
