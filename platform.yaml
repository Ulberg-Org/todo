# What the todo app needs from the platform (D47). The platform renders it for every environment (D60): the
# same services, routes and database locally and in Azure; only what the environment decides differs.
apiVersion: platform/v1
app: todo
services:
  - name: backend
    build: backend # the Dockerfile's folder; locally its `dev` target runs with hot reload (D61)
    image: todo/backend # the repository in ACR (D54)
    port: 8080 # the public API (D73)
    replicas: { min: 2, max: 4 } # never fewer than two (D57)
    resources: { cpu: 250m, memory: 256Mi }
    # Health and version on their own port, which only the platform's probes reach (D73).
    health: { port: 8081, live: /health/live, ready: /health/ready }
    # No routes yet: the public API has no endpoints. Each API gets its own routes, port and OpenAPI spec
    # (Phase 6, D73).
    database: todo
databases:
  todo: { engine: postgres }
